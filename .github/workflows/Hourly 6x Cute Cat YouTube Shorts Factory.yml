# Same registered path as main; choose develop explicitly in Run workflow.
name: Handwritten Script Preview (develop only)
run-name: Script preview · ${{ inputs.script_path || 'stories/EP01.md' }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      script_path:
        description: 'Markdown script inside stories/ (default: stories/EP01.md)'
        type: string
        default: stories/EP01.md
      visual_style:
        description: 'Visual style for all four scenes'
        type: choice
        options:
          - photorealistic
          - cinematic_3d
          - cel_anime
          - watercolor
          - clay_stop_motion
          - paper_diorama
        default: photorealistic
      scene_seconds:
        description: 'Seconds per photograph (4 photos)'
        type: choice
        options: ['5', '4', '6']
        default: '5'
      bgm_path:
        description: 'Optional licensed audio in assets/bgm/; blank = generated instrumental BGM'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: handwritten-script-preview-develop
  cancel-in-progress: false

jobs:
  preview-script:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-noto-cjk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt 'google-genai==2.34.0'

      - name: Test handwritten script reader
        run: python -m unittest discover -s tests -p 'test_script_preview.py' -v

      - name: Validate script before image generation
        env:
          SCRIPT_PATH: ${{ inputs.script_path || 'stories/EP01.md' }}
          VISUAL_STYLE: ${{ inputs.visual_style || 'photorealistic' }}
          SCENE_SECONDS: ${{ inputs.scene_seconds || '5' }}
          BGM_PATH: ${{ inputs.bgm_path || '' }}
        run: python script_preview.py --script "$SCRIPT_PATH" --style "$VISUAL_STYLE" --scene-seconds "$SCENE_SECONDS" --bgm "$BGM_PATH" --validate-only

      - name: Render handwritten script (no Sheet or YouTube upload)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL || 'gemini-2.5-flash-image' }}
          SCRIPT_PATH: ${{ inputs.script_path || 'stories/EP01.md' }}
          VISUAL_STYLE: ${{ inputs.visual_style || 'photorealistic' }}
          SCENE_SECONDS: ${{ inputs.scene_seconds || '5' }}
          BGM_PATH: ${{ inputs.bgm_path || '' }}
        run: python script_preview.py --script "$SCRIPT_PATH" --style "$VISUAL_STYLE" --scene-seconds "$SCENE_SECONDS" --bgm "$BGM_PATH"

      - name: Downloadable MP4 and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: script-preview-${{ github.run_number }}-${{ github.run_attempt }}
          path: output/script-preview/
          if-no-files-found: warn
          retention-days: 7
