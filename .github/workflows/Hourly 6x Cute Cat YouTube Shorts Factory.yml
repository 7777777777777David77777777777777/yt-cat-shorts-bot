name: Hourly 6x Cute Cat YouTube Shorts Factory

on:
  schedule:
    - cron: '7 16 * * *'  # 台灣 00:07
    - cron: '7 17 * * *'  # 台灣 01:07
    - cron: '7 18 * * *'  # 台灣 02:07
    - cron: '7 19 * * *'  # 台灣 03:07
    - cron: '7 20 * * *'  # 台灣 04:07
    - cron: '7 21 * * *'  # 台灣 05:07
  workflow_dispatch: # 保留手動按鈕，隨時可按 Run workflow 立即測試

jobs:
  generate-and-upload-short:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Install FFmpeg and Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-noto-cjk

      - name: 3. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 4. Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 5. Fetch Episode from Google Sheet and Render Video
        env:
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      - name: 6. Upload to YouTube and Update Sheet (1/6 to 6/6)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TRANSLATION_MODEL: ${{ vars.GEMINI_TRANSLATION_MODEL || 'gemini-3.5-flash-lite' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
        run: |
          python upload_youtube.py

      - name: 7. Backup Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-short-run-${{ github.run_number }}
          path: |
            output/final_short.mp4
            output/metadata.json
          retention-days: 7
