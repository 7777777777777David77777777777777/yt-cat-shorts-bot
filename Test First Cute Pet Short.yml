name: Test First Cute Pet Short (Manual Only)

on:
  workflow_dispatch: # 只有你手動按 Run workflow 才會跑，不會自動排程執行

jobs:
  test-generate-short:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Install FFmpeg and Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-noto-cjk

      - name: 3. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 4. Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 5. Generate First Short Video
        run: |
          python main.py

      - name: 6. Save Video for Download
        uses: actions/upload-artifact@v4
        with:
          name: first-test-short-video
          path: |
            output/final_short.mp4
            output/metadata.json
          retention-days: 7
